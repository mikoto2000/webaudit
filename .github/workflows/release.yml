name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build release binaries
        run: |
          mkdir -p release
          GOOS=windows GOARCH=amd64 go build -mod=vendor -trimpath -buildvcs=false -o release/webaudit-windows-amd64.exe ./cmd/webaudit
          GOOS=windows GOARCH=arm64 go build -mod=vendor -trimpath -buildvcs=false -o release/webaudit-windows-arm64.exe ./cmd/webaudit
          GOOS=linux GOARCH=amd64 go build -mod=vendor -trimpath -buildvcs=false -o release/webaudit-linux-amd64 ./cmd/webaudit
          GOOS=linux GOARCH=arm64 go build -mod=vendor -trimpath -buildvcs=false -o release/webaudit-linux-arm64 ./cmd/webaudit
          GOOS=darwin GOARCH=amd64 go build -mod=vendor -trimpath -buildvcs=false -o release/webaudit-darwin-amd64 ./cmd/webaudit
          GOOS=darwin GOARCH=arm64 go build -mod=vendor -trimpath -buildvcs=false -o release/webaudit-darwin-arm64 ./cmd/webaudit
      - name: Verify version and prepare notices and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(./release/webaudit-linux-amd64 --version)"
          [[ "$version" == "WebAudit ${RELEASE_TAG#v} "* ]]
          cp LICENSE THIRD_PARTY_NOTICES.md release/
          (cd release && sha256sum webaudit-* LICENSE THIRD_PARTY_NOTICES.md > SHA256SUMS.txt)
      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              release/*
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              release/*
          fi
